name: Daily Data Retrieval Automation

on:
  schedule:
    - cron: "0 21 */2 * *" # Runs every other day at 9PM UTC (2PM PST the same day)
  workflow_dispatch: # Allow manual trigger

jobs:
  run-script:
    runs-on: ubuntu-latest

    env:
      UV_CACHE_DIR: /tmp/.uv-cache

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9

        # Removed venv step because uv automatically makes one.

        # Cache with uv
        # I kept actions/cache because I think more people would be familar with it?
        # Though there is a simpler way to uv cache in actions:
        # https://docs.astral.sh/uv/guides/integration/github/#caching
      - name: cache environment
        id: cached-dependencies
        uses: actions/cache@v6
        with:
          path: /tmp/.uv-cache
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
            uv-${{ runner.os }}

      - name: Minimize uv cache
        run: uv cache prune --ci

      - name: install python packages
        run: uv sync --locked --all-extras

      - name: Run script
        run: uv run python main.py --days-needed 2

        # Custom CLI Command
        # fmt: off
        #LINT.IF .env.example
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DB_TABLE_NAME: ${{ secrets.DB_TABLE_NAME}}
          LINKEDIN_URL: ${{ secrets.LINKEDIN_URL}}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK}}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY}}
          LINKEDIN_INTERN_URL: ${{ secrets.LINKEDIN_INTERN_URL}}
          GH_INTERN24_URL: ${{ secrets.GH_INTERN24_URL}}
          PROMPTS_PATH: ${{ secrets.PROMPTS_PATH}}
          MESSAGE_PATH: ${{ secrets.MESSAGE_PATH}}
#LINT.END
# fmt: on
